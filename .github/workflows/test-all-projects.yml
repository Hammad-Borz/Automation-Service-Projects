name: Portfolio Test Suites

on:
  push:
    branches: [main]
    paths:
      - 'AutoFlow-Business-Automation-System/**'
      - 'ConnectHub/**'
      - 'DataMiner/**'
      - 'DocuMind/**'
      - 'TaskPilot/**'
      - 'KnowledgeBase-AI/**'
      - 'MailFlow/**'
      - 'ReportFlow/**'
      - 'DataOps-Automator/**'
      - '.github/workflows/test-all-projects.yml'
  pull_request:
    paths:
      - 'AutoFlow-Business-Automation-System/**'
      - 'ConnectHub/**'
      - 'DataMiner/**'
      - 'DocuMind/**'
      - 'TaskPilot/**'
      - 'KnowledgeBase-AI/**'
      - 'MailFlow/**'
      - 'ReportFlow/**'
      - 'DataOps-Automator/**'
      - '.github/workflows/test-all-projects.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - AutoFlow-Business-Automation-System
          - ConnectHub
          - DataMiner
          - DocuMind
          - TaskPilot
          - KnowledgeBase-AI
          - MailFlow
          - ReportFlow
          - DataOps-Automator

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
